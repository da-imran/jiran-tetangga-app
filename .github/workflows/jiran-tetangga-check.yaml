name: jiran-tetangga-ci

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (api-server)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jiran-tetangga:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: echo "CI pipeline build stage completed."

  test:
    name: Backend tests
    needs: build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env files
        run: |
          cat > .env <<EOF
          NODE_ENV=ci
          HOSTNAME=localhost
          ROUTE_PREPEND=jiran-tetangga
          API_VERSION=1.0.0
          APP_VERSION=1.0.0
          VERSION=v1
          PORT=8118
          MONGO_URI=mongodb://localhost:27017/jiran-tetangga
          MONGODB_URI=mongodb://localhost:27017/jiran-tetangga
          MONGODB_DBNAME=jiran-tetangga
          JWT_KEY=${{ secrets.JWT_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          API_KEY=${{ secrets.API_KEY }}
          INFISICAL_URI=${{ secrets.INFISICAL_URI }}
          INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_ENV=ci
          EOF
          cp .env packages/api-server/.env

      - name: Run backend tests
        working-directory: packages/api-server
        run: pnpm test
        env:
          CI: true

      - name: Done
        run: echo "CI pipeline test stage completed."
